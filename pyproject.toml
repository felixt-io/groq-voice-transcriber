[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groq-voice-transcriber"
version = "0.1.0"
description = "Batch audio-to-text transcription using Groq's Whisper API, with automatic compression and chunking."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "requests>=2.31.0"
]

[project.scripts]
groq-transcribe = "groq_voice_transcriber.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
